<app-base-component>
  <ion-grid>
    <ion-row>
      <!-- Columna principal, contenido principal -->
      <ion-col size-md="8" size-sm="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Contenido Principal</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Este es el contenido principal de la página.
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Columna secundaria, contenido complementario -->
      <ion-col size-md="4" size-sm="12">
        <ion-card color="secondary">
          <ion-card-header>
            <ion-card-title>Contenido Secundario</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Este es el contenido secundario o complementario.
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</app-base-component>
