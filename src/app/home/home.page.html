<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      <!-- Logo -->
      <div class="logo-container">
        <img src="assets/icon/favicon.png" alt="Logo">
        <h2>GalileoNews</h2>
      </div>

      <!-- Login Form -->
      <form>
        <div class="form-group">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Ingresa tu correo"
            required
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Ingresa tu contraseña"
            required
          >
        </div>

        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="remember">
          <label class="form-check-label" for="remember">Recordar mi contraseña</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
      </form>

      <!-- Alternative Access -->
      <div class="alternative-access">
        <p>O accede con</p>
        <button class="btn btn-outline-primary w-100">
          <i class="bi bi-google"></i> Acceder con Google
        </button>
        <div class="d-flex justify-content-between">
          <a href="#" class="text-primary">Soporte</a>
          <a href="#" class="text-primary">¿Olvidaste tu contraseña?</a>
      </div>
      </div>
    </div>
  </div>
</div>
